paths:
  /health:
    get:
      tags: [Salud]
      summary: Estado del servicio
      responses:
        "200":
          description: El servicio está levantado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    example: 12.5
